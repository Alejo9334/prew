name: Instalar copia independiente AR en prew

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publicar-prew.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-prew
  cancel-in-progress: false

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio prew
        uses: actions/checkout@v4
        with:
          path: proyecto
          persist-credentials: true

      - name: Revisar copia existente
        id: copia
        shell: bash
        run: |
          if [ -s proyecto/public/index.html ] && [ -s proyecto/public/editor.html ] && [ -s proyecto/public/targets.mind ]; then
            echo "instalada=true" >> "$GITHUB_OUTPUT"
          else
            echo "instalada=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Obtener versión ANTÁRTIDA únicamente durante la primera instalación
        if: steps.copia.outputs.instalada == 'false'
        uses: actions/checkout@v4
        with:
          repository: Alejo9334/Antartida
          ref: main
          sparse-checkout: |
            public
          sparse-checkout-cone-mode: true
          path: base

      - name: Copiar la aplicación independientemente
        if: steps.copia.outputs.instalada == 'false'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proyecto/public
          cp -a base/public/. proyecto/public/
          test -s proyecto/public/index.html
          test -s proyecto/public/editor.html
          test -s proyecto/public/catalogo.json
          test -s proyecto/public/targets.mind
          echo "Visor, editor, imágenes y reconocimiento AR copiados."

      - name: Guardar archivos en prew
        working-directory: proyecto
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Instalar copia autónoma de visor y editor AR en prew"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos para publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: proyecto/public

  publicar:
    runs-on: ubuntu-latest
    needs: instalar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar visor y editor
        id: deployment
        uses: actions/deploy-pages@v4
